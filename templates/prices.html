<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="/static/bootstrap.min.css" rel="stylesheet">
  <title>RCE - Energy Manager</title>
</head>

<body>
  <div class="container">
    <h1>RCE</h1>
    <h3>{{ date }}</h3>
    <div class="row">
      <div class="col-3">
        <div class="input-group input-group-sm">
          <input id="date-selector" type="date" class="form-control" value="{{ date }}" />
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col">
        <div style="background:#111;border-radius:6px;padding:12px">
          <canvas id="rce-chart"></canvas>
        </div>
      </div>
    </div>
    <div class="row mt-2">
      <div class="col">
        <a href="/" class="btn btn-primary">< Back</a>
        <a href="/eco" class="btn btn-success">🔋 Eco timer</a>
        <a href="/config" class="btn btn-primary">🔧 Inverter Config</a>
      </div>
    </div>
  </div>

  <style>
    #rce-chart { height: 400px; }
    @media (max-width: 576px) { #rce-chart { height: 260px; } }
  </style>
  <script>
    document.getElementById('date-selector').addEventListener('change', function() {
      window.location.href = '/prices?date=' + this.value;
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script>
    (async function () {
      const chartDate = '{{ date }}';
      const resp = await fetch('/prices/rce.json?date=' + chartDate);
      const data = await resp.json();
      const labels = data.series.map(p => p.time);
      const prices = data.series.map(p => p.price);
      const minPrice = Math.min(...prices);

      const hourlyAvg = {};
      prices.forEach((p, i) => {
        const h = parseInt(labels[i].split(':')[0], 10);
        if (!hourlyAvg[h]) hourlyAvg[h] = [];
        hourlyAvg[h].push(p);
      });
      Object.keys(hourlyAvg).forEach(h => {
        const arr = hourlyAvg[h];
        hourlyAvg[h] = arr.reduce((a, b) => a + b, 0) / arr.length;
      });
      const hourlyPrices = prices.map((_, i) => hourlyAvg[parseInt(labels[i].split(':')[0], 10)]);

      const overlayPlugin = {
        id: 'overlay',
        afterDraw(chart) {
          const { ctx, scales: { x, y } } = chart;

          // horizontal dashed line at y=0
          const y0 = y.getPixelForValue(0);
          ctx.save();
          ctx.strokeStyle = 'rgba(160,160,160,0.5)';
          ctx.lineWidth = 1;
          ctx.setLineDash([4, 4]);
          ctx.beginPath();
          ctx.moveTo(x.left, y0);
          ctx.lineTo(x.right, y0);
          ctx.stroke();
          ctx.restore();

          // red vertical line at current time (today only)
          const today = new Date().toISOString().slice(0, 10);
          if (chartDate !== today) return;
          const now = new Date();
          const nowIdx = (now.getHours() * 60 + now.getMinutes()) / 15;
          const xPx = x.getPixelForValue(nowIdx);
          ctx.save();
          ctx.strokeStyle = '#ff5555';
          ctx.lineWidth = 1.5;
          ctx.setLineDash([]);
          ctx.beginPath();
          ctx.moveTo(xPx, y.top);
          ctx.lineTo(xPx, y.bottom);
          ctx.stroke();
          ctx.restore();
        }
      };

      new Chart(document.getElementById('rce-chart'), {
        type: 'line',
        plugins: [overlayPlugin],
        data: {
          labels,
          datasets: [{
            label: 'RCE',
            data: prices,
            stepped: 'before',
            borderColor: '#5b8dd9',
            borderWidth: 2,
            pointRadius: 0,
            pointHitRadius: 8,
            fill: false,
          }, {
            label: '1h avg',
            data: hourlyPrices,
            stepped: 'before',
            borderColor: 'transparent',
            borderWidth: 0,
            pointRadius: 0,
            pointHitRadius: 8,
            fill: 'origin',
            backgroundColor: 'rgba(240,160,80,0.45)',
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          animation: false,
          interaction: { mode: 'index', intersect: false },
          plugins: {
            legend: {
              display: true,
              labels: { color: '#aaa', boxWidth: 20, font: { size: 11 } }
            },
            tooltip: {
              backgroundColor: '#222',
              borderColor: '#555',
              borderWidth: 1,
              titleColor: '#aaa',
              bodyColor: '#fff',
              padding: 8,
              callbacks: {
                title: items => items[0].label,
                label: item => ' ' + (item.raw != null ? item.raw.toFixed(2) : '—') + ' PLN/MWh',
              }
            }
          },
          scales: {
            x: {
              ticks: {
                color: '#888',
                maxRotation: 0,
                autoSkip: false,
                font: { size: 11 },
                callback(val, index) {
                  const step = this.chart.width < 500 ? 8 : 4;
                  return index % step === 0 ? this.getLabelForValue(val) : '';
                },
              },
              grid: {
                color: ctx => ctx.index % 4 === 0 ? 'rgba(128,128,128,0.25)' : 'transparent',
                borderDash: [3, 4],
              },
              border: { color: '#444' }
            },
            y: {
              min: Math.min(0, minPrice),
              ticks: {
                color: '#888',
                font: { size: 11 },
                callback(v) {
                  return this.chart.width < 500 ? v : v + ' PLN';
                },
              },
              grid: {
                color: 'rgba(128,128,128,0.2)',
                borderDash: [3, 4],
              },
              border: { color: '#444' }
            }
          }
        }
      });
    })();
  </script>
</body>

</html>
