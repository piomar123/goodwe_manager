<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="/static/bootstrap.min.css" rel="stylesheet">
  <title>Forecast - Energy Manager</title>
</head>

<body>
  <div class="container">
    <h1>Forecast</h1>
    <h3>{{ date }}</h3>
    <div class="row">
      <div class="col-3">
        <div class="input-group input-group-sm">
          <input id="date-selector" type="date" class="form-control" value="{{ date }}" />
        </div>
      </div>
      <div class="col-4">
        <div class="input-group input-group-sm">
          <select id="fetch-time-selector" class="form-select"></select>
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col">
        <p id="forecast-summary">{{ summary }}</p>
      </div>
    </div>
    <div class="row">
      <div class="col">
        <div id="forecast-chart-error" class="alert alert-warning d-none" role="alert">
          Couldn't load the hourly forecast. Try reloading the page.
        </div>
        <div id="solcast-unavailable-note" class="alert alert-secondary d-none" role="alert">
          Solcast forecast unavailable for this date.
        </div>
        <div style="background:#111;border-radius:6px;padding:12px">
          <canvas id="forecast-chart"></canvas>
        </div>
      </div>
    </div>
    <div class="row mt-3">
      <div class="col">
        <div id="forecast-table-scroll">
          <table class="table table-sm table-dark table-striped" id="forecast-table">
            <thead id="forecast-table-head"></thead>
            <tbody id="forecast-table-body"></tbody>
          </table>
        </div>
        <div id="forecast-table-empty" class="text-muted d-none">No data.</div>
      </div>
    </div>
    <div class="row">
      <div class="col">
        <a href="/" class="btn btn-primary">< Back</a>
        <a href="/eco" class="btn btn-success">🔋 Eco timer</a>
        <a href="/config" class="btn btn-primary">🔧 Inverter Config</a>
      </div>
    </div>
  </div>

  <style>
    #forecast-chart { height: 400px; }
    @media (max-width: 576px) { #forecast-chart { height: 260px; } }
    /* main.py's _build_forecast_summary joins Meteosource/Solcast with a
       literal \n - this renders that as a real line break without opting
       the template out of Jinja's autoescaping (no `| safe` + `<br>`
       needed for a plain two-line label). */
    #forecast-summary { white-space: pre-line; }
    /* Sticky header that sticks to the *page's* scroll (no more fixed-height
       inner scroll box) - needs its own opaque background (matching
       Bootstrap's table-dark bg) since a sticky element is otherwise
       transparent and rows would show through as they scroll under it. */
    #forecast-table thead th { position: sticky; top: 0; background-color: #212529; z-index: 1; }
  </style>
  <script>
    document.getElementById('date-selector').addEventListener('change', function() {
      window.location.href = '/forecast?date=' + this.value;
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="/static/chart-theme.js"></script>
  <script src="/static/table.js"></script>
  <script src="/static/js/forecast-calc.js"></script>
  <script>
    (async function () {
      const chartDate = '{{ date }}';
      const initialFetchedAt = {{ fetched_at | tojson }};
      let data;
      try {
        const url = new URL('/forecast/hourly.json', window.location.origin);
        url.searchParams.set('date', chartDate);
        if (initialFetchedAt) url.searchParams.set('fetched_at', initialFetchedAt);
        const resp = await fetch(url);
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        data = await resp.json();
      } catch (err) {
        console.error('Failed to load hourly forecast:', err);
        document.getElementById('forecast-chart-error').classList.remove('d-none');
        return;
      }

      // Fetch-time dropdown: "Latest" (no fetched_at param) plus every
      // distinct past fetch for this date, newest first.
      const selector = document.getElementById('fetch-time-selector');
      const fmtFetchedAt = epoch => new Date(epoch * 1000).toLocaleString();
      selector.innerHTML = ['<option value="">Latest</option>']
        .concat(data.fetch_times.map(t => `<option value="${t}"${t === data.selected_fetched_at ? ' selected' : ''}>${fmtFetchedAt(t)}</option>`))
        .join('');
      selector.addEventListener('change', function () {
        const url = new URL(window.location.href);
        if (this.value) url.searchParams.set('fetched_at', this.value); else url.searchParams.delete('fetched_at');
        window.location.href = url.toString();
      });

      document.getElementById('solcast-unavailable-note').classList.toggle('d-none', data.solcast.available);

      const meteosourceByHour = Object.fromEntries(data.meteosource.hours.map(h => [h.time, h.kwh]));
      // The chart/table's 24-category backbone - the fixed 'HH:00' sequence
      // for a full day, not derived from any one source's actual hours.
      // Previously this was data.meteosource.hours.map(h => h.time): fine
      // whenever Meteosource has a snapshot, but a specific historical
      // fetched_at can have Meteosource empty (no exact-match snapshot at
      // that timestamp) while Solcast/actuals do have data there - with a
      // Meteosource-derived backbone that blanked the entire chart AND
      // table, hiding data that was actually present. Every per-source
      // lookup below already tolerates a missing hour (`xByHour[t] || 0`
      // etc.), so a fixed backbone needs no other changes.
      const hourLabels = Array.from({ length: 24 }, (_, h) => `${String(h).padStart(2, '0')}:00`);
      const hourCount = hourLabels.length; // one entry per hour of the day, so also this chart's category count
      const actualByHour = Object.fromEntries(data.actual.hours.map(h => [h.time, h.kwh]));
      const actualValues = hourLabels.map(t => actualByHour[t] ?? null); // null where no measured data yet - the real values, used for the table/tooltip
      const currentHourIndex = data.actual.current_hour ? hourLabels.indexOf(data.actual.current_hour) : -1;
      const partialKwh = data.actual.current_hour_actual_partial_kwh; // how much the in-progress hour has produced so far (not a full hour's worth)
      const actualLineColor = '#22cc66'; // pure green - reads clearly as "measured" against the near-white/amber forecast bars
      const trailingHourColor = '#ffffff'; // white for the current, still-partial hour - distinct from the teal/blue/amber used elsewhere in this chart

      // Fill in the current-hour slot for rendering continuity: with 'before'
      // stepped mode, a segment holds its *starting* point's value flat
      // until the next point's x, so the last real value - having no next
      // point, since the current hour is still null - never gets a segment
      // drawn out to the current-hour boundary. Give the line something
      // real to step to there - the live partial reading, if there is one
      // (colored separately, since it's not a complete hour); otherwise
      // fall back to cloning the last real value just to close the visual
      // gap. Either way this is never shown in the tooltip or the table's
      // Actual column as if it were actual_total_kwh - see the tooltip
      // filter and rows below. currentHourIndex can legitimately be 0 (the
      // 00:00 hour), so this must run for index 0 too - not just
      // truthy/positive indices.
      const chartActualValues = actualValues.slice();
      const hasRealPartial = partialKwh != null;
      if (currentHourIndex >= 0 && chartActualValues[currentHourIndex] == null) {
        if (hasRealPartial) {
          chartActualValues[currentHourIndex] = partialKwh;
        } else if (chartActualValues[currentHourIndex - 1] != null) {
          chartActualValues[currentHourIndex] = chartActualValues[currentHourIndex - 1];
        }
      }

      const solcastHourly = ForecastCalc.aggregateSolcastHourly(data.solcast.periods);
      const solcastByHour = Object.fromEntries(solcastHourly.map(h => [h.time, h]));
      const solcastActualsHourly = ForecastCalc.aggregateSolcastActualsHourly(data.solcast_actuals.periods);
      const solcastActualsByHour = Object.fromEntries(solcastActualsHourly.map(h => [h.time, h]));

      const columns = ['Hour', 'Meteosource', 'Solcast'];
      if (data.solcast_actuals.available) columns.push('Solcast Estimated Actual');
      columns.push('Actual', 'Actual cumul.');
      let cumActualKwh = 0;
      const rows = hourLabels.map((t, idx) => {
        const row = { Hour: t, Meteosource: (meteosourceByHour[t] || 0).toFixed(2) };
        const s = solcastByHour[t];
        row['Solcast'] = s ? `${s.c50.toFixed(2)} (${s.c10.toFixed(2)}–${s.c90.toFixed(2)})` : '—';
        if (data.solcast_actuals.available) {
          const sa = solcastActualsByHour[t];
          row['Solcast Estimated Actual'] = sa ? sa.kwh.toFixed(2) : '—';
        }
        if (actualByHour[t] != null) {
          cumActualKwh += actualByHour[t];
          row['Actual'] = actualByHour[t].toFixed(2);
          row['Actual cumul.'] = cumActualKwh.toFixed(2);
        } else if (idx === currentHourIndex && partialKwh != null) {
          row['Actual'] = `${partialKwh.toFixed(2)} (so far)`;
          row['Actual cumul.'] = `${(cumActualKwh + partialKwh).toFixed(2)} (so far)`;
        } else {
          // Not a completed hour and not the live partial one either - no
          // meaningful "actual production through this hour" figure yet
          // (covers future hours, and any hour past-due but still missing
          // data, e.g. no inverter connection).
          row['Actual'] = '—';
          row['Actual cumul.'] = '—';
        }
        return row;
      });
      renderTable('forecast-table-head', 'forecast-table-body', 'forecast-table-empty', columns, rows);

      // The actual-production overlay uses a real numeric (linear) x axis
      // rather than the category axis prices.html/history.html use, so
      // forecast bars can be centered at hour+0.5 (spanning [hour, hour+1))
      // while the Actual line's points sit at the interval's left edge
      // (hour) - 'before' stepping then holds flat across exactly that same
      // [hour, hour+1) span, so the two genuinely overlap instead of just
      // looking close. (On a category axis, bars are centered on their tick
      // but a stepped line's flat run sits *between* ticks - no stepped mode
      // can make the two line up while sharing that axis.) The current
      // (still-partial) hour is drawn in a distinct color rather than
      // faded/dashed - a plain color swap reads much more clearly than a
      // faint dashed line did.

      const c50Color = '#e0a458';
      const solcastActualsColor = ChartTheme.seriesColor(3); // teal - distinct from Meteosource's blue-purple, Solcast's amber, and Actual's green

      function solcastActualsDatasets() {
        if (!data.solcast_actuals.available) return [];
        // Hourly-aggregated, same x-positions (idx + 0.5) as Meteosource/
        // Solcast forecast - see
        // https://github.com/piomar123/goodwe_manager/pull/26 for the
        // design rationale (the design spec doc itself was removed from
        // the tree, but is still visible in that PR's history). Dashed
        // border to visually read as "estimate", not a
        // measurement - deliberately its own color/label (not reusing the
        // real "Actual" line's green) so the two are never confused. A
        // missing hour is pinned to 0, same convention solcastDatasets()
        // uses for the same reason (a line dataset needs a numeric y at
        // every x).
        const points = hourLabels.map((t, idx) => ({ x: idx + 0.5, y: (solcastActualsByHour[t] || {}).kwh ?? 0 }));
        return [
          {
            type: 'line',
            label: 'Solcast Estimated Actual',
            data: points,
            borderColor: solcastActualsColor,
            borderDash: [6, 4],
            borderWidth: 2,
            pointRadius: 0,
            fill: false,
            order: 1, // above Solcast forecast (order 2/3), below real Actual (order -1)
          },
        ];
      }

      function meteosourceBarDataset() {
        return {
          type: 'bar',
          label: 'Meteosource',
          data: hourLabels.map((t, idx) => ({ x: idx + 0.5, y: meteosourceByHour[t] || 0 })),
          backgroundColor: ChartTheme.seriesColor(0),
          barPercentage: 1.0,
          categoryPercentage: 1.0,
          order: 10, // bottom layer - see https://github.com/piomar123/goodwe_manager/pull/26
        };
      }

      function solcastDatasets() {
        if (!data.solcast.available) return [];
        // Hourly-aggregated, same resolution and same x-positions
        // (idx + 0.5) as the Meteosource bar - see
        // https://github.com/piomar123/goodwe_manager/pull/26 for the
        // design rationale (the design spec doc itself was removed from
        // the tree, but is still visible in that PR's history).
        // solcastByHour is already built above (table
        // section) from the same ForecastCalc.aggregateSolcastHourly call;
        // reused here instead of a second aggregation pass. A missing hour
        // (e.g. the very edge of a merged snapshot window) is deliberately
        // pinned to 0 here - unlike the table, which shows '—' for the same
        // case - because a filled band needs a numeric y at every x
        // position; it can't skip a point the way a table cell can.
        const points = key => hourLabels.map((t, idx) => ({ x: idx + 0.5, y: (solcastByHour[t] || {})[key] ?? 0 }));
        return [
          { type: 'line', label: 'Solcast c10', data: points('c10'), borderWidth: 0, pointRadius: 0, fill: false, order: 3 },
          { type: 'line', label: 'Solcast c10–c90 range', data: points('c90'), borderWidth: 0, pointRadius: 0, fill: '-1', backgroundColor: ChartTheme.withAlpha(c50Color, 0.18), order: 3 },
          { type: 'line', label: 'Solcast c50', data: points('c50'), borderColor: c50Color, backgroundColor: c50Color, borderWidth: 2, pointRadius: 0, fill: false, order: 2 },
        ];
      }

      function actualLineDataset() {
        return {
          type: 'line',
          label: 'Actual',
          // With 'before' stepping, the segment ending at currentHourIndex
          // draws flat at the *previous*, already-complete hour's real value
          // across that whole segment before stepping down right at the
          // boundary - so coloring that whole segment purple (as an earlier
          // version did, keyed on its p1DataIndex) mislabeled a full hour of
          // real data as "current/partial". The current hour's own purple
          // span is drawn separately by currentHourStepExtensionPlugin,
          // covering only its own [hour, hour+1) - this stays a plain,
          // single-colored line.
          data: chartActualValues.map((v, idx) => ({ x: idx, y: v })),
          borderColor: actualLineColor,
          spanGaps: false, // don't bridge the gap where there's no measured data yet
          stepped: 'before',
          pointRadius: 0,
          order: -1, // draw on top of everything else
          borderWidth: 1.5,
          fill: 'origin',
          backgroundColor: ChartTheme.withAlpha(actualLineColor, 0.4),
        };
      }

      let chart = null;

      // The vertical "now" marker - only drawn when viewing today. Styled
      // and positioned to match the RCE prices chart's now-line: red, solid,
      // and swept to the actual current minute rather than just snapping to
      // the current hour's tick.
      const nowLinePlugin = {
        id: 'nowLine',
        afterDatasetsDraw(c) {
          if (currentHourIndex < 0) return;
          const { ctx, scales: { x, y } } = c;
          const now = new Date();
          const hourFraction = (now.getMinutes() + now.getSeconds() / 60) / 60;
          // Ticks are hour *starts* (hour 8's tick = 08:00), so the sweep
          // runs from that tick straight to the next one.
          const nowIdx = currentHourIndex + hourFraction;
          const xPx = x.getPixelForValue(nowIdx);
          ctx.save();
          ctx.strokeStyle = '#ff5555'; // matches the RCE prices chart's now-line
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(xPx, y.top);
          ctx.lineTo(xPx, y.bottom);
          ctx.stroke();
          ctx.restore();
        }
      };

      // 'before' stepping needs a point at hour+1 to hold a segment flat
      // across that hour's span - which is exactly what the current,
      // still-in-progress hour doesn't have (its point is the last one;
      // there's nothing after it to step to). Without this, the current
      // hour's own value never gets a visible flat run of its own - just the
      // tail end of the *previous* hour's segment dropping to a single
      // point, which reads as barely more than a vertical tick. Draw the
      // missing flat run and its fill manually across the current hour's
      // own [hour, hour+1) span instead of adding a real data point, which
      // would shift every dataset's index alignment out of sync for
      // tooltips/interaction. Only for a *real* live partial reading,
      // though - chartActualValues may instead hold a cloned-previous-hour
      // placeholder (see above) just to close the line's visual gap when
      // there's no live reading at all; drawing that placeholder here would
      // show a solid highlighted run that looks exactly like real
      // current-hour data when there isn't any.
      const currentHourStepExtensionPlugin = {
        id: 'currentHourStepExtension',
        afterDatasetsDraw(c) {
          if (currentHourIndex < 0 || !hasRealPartial) return;
          const value = chartActualValues[currentHourIndex];
          if (value == null) return;
          const { ctx, scales: { x, y } } = c;
          const x0 = x.getPixelForValue(currentHourIndex);
          const x1 = x.getPixelForValue(currentHourIndex + 1);
          const yPx = y.getPixelForValue(value);
          ctx.save();
          const yBase = y.getPixelForValue(0);
          ctx.fillStyle = ChartTheme.withAlpha(trailingHourColor, 0.4);
          ctx.fillRect(x0, yPx, x1 - x0, yBase - yPx);
          ctx.strokeStyle = trailingHourColor;
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(x0, yPx);
          ctx.lineTo(x1, yPx);
          ctx.stroke();
          ctx.restore();
        }
      };

      function buildChart() {
        if (chart) chart.destroy();

        const datasets = [meteosourceBarDataset(), ...solcastDatasets(), ...solcastActualsDatasets(), actualLineDataset()];

        // A real numeric axis so forecast bars (centered at hour+0.5) and
        // the line (points at the interval's left edge, hour) can genuinely
        // share the same [hour, hour+1) span - see the dataset-builder
        // comments above for why. NOT stacked: Meteosource is now a single
        // summed E+W bar series (not two orientation bars stacked on each
        // other like this chart used to have), so there's nothing left to
        // stack - leaving `stacked: true` here made Chart.js accumulate the
        // Solcast/Actual line datasets on top of the bar's value instead of
        // drawing them at their own real value.
        const xScale = {
          type: 'linear',
          min: 0,
          max: hourCount,
          afterBuildTicks: axis => { axis.ticks = hourLabels.map((t, idx) => ({ value: idx })); },
          ticks: {
            color: ChartTheme.axisTickColor,
            maxRotation: 0,
            autoSkip: false,
            font: { size: 11 },
            callback(value) {
              const step = this.chart.width < 500 ? 4 : 2;
              const idx = Math.round(value);
              return idx % step === 0 && hourLabels[idx] ? hourLabels[idx] : '';
            },
          },
          grid: { display: false },
          border: { color: ChartTheme.axisBorderColor }
        };

        chart = new Chart(document.getElementById('forecast-chart'), {
          type: 'bar',
          plugins: [currentHourStepExtensionPlugin, nowLinePlugin],
          data: { datasets },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            animation: false,
            interaction: { mode: 'index', intersect: false },
            plugins: {
              legend: { ...ChartTheme.legend, labels: { ...ChartTheme.legend.labels, filter: item => item.text !== 'Solcast c10' && item.text !== 'Solcast c10–c90 range' } },
              tooltip: {
                ...ChartTheme.tooltip,
                // At currentHourIndex, chartActualValues holds either the
                // real partial reading (partialKwh != null - show it,
                // clearly marked as partial) or, lacking that, a clone of
                // the last real hour used only to close the visual gap
                // (partialKwh == null - hide it, it's not a real reading).
                // The Solcast c10/c10-c90-range datasets are internal
                // helpers for drawing the shaded band - only the visible
                // "Solcast c50" line should show its own tooltip row.
                filter: item => !(item.dataset.label === 'Actual' && item.dataIndex === currentHourIndex && partialKwh == null)
                  && item.dataset.label !== 'Solcast c10' && item.dataset.label !== 'Solcast c10–c90 range',
                callbacks: {
                  // Forecast bars sit at x=hour+0.5 and the Actual line at
                  // x=hour - two different x values for "the same hour".
                  // Chart.js's default tooltip title comes from whichever
                  // dataset's point is nearest the cursor, so it'd flip
                  // between an integer ("7") and a half ("7.5") depending on
                  // which one that happened to be. dataIndex is the array
                  // position, not the x value, and is consistent across
                  // every dataset for a given hour - use that instead to
                  // always show the real hour.
                  title: items => items.length ? hourLabels[items[0].dataIndex] : '',
                  // item.parsed.y is always a plain number regardless of
                  // the underlying data point being a bare number or a
                  // {x, y} object - item.raw would differ between the two
                  // and need separate handling.
                  label: item => {
                    const val = item.parsed.y;
                    if (item.dataset.label !== 'Actual' || val == null) {
                      return ` ${item.dataset.label}: ${val != null ? val.toFixed(2) : '—'} kWh`;
                    }
                    const suffix = item.dataIndex === currentHourIndex ? ' (so far, partial)' : '';
                    return ` Actual: ${val.toFixed(2)} kWh${suffix}`;
                  },
                }
              }
            },
            scales: {
              x: xScale,
              y: {
                beginAtZero: true,
                ticks: {
                  color: ChartTheme.axisTickColor,
                  font: { size: 11 },
                  callback(v) {
                    return this.chart.width < 500 ? v : v + ' kWh';
                  },
                },
                grid: {
                  color: ChartTheme.gridColor,
                  borderDash: ChartTheme.gridDash,
                },
                border: { color: ChartTheme.axisBorderColor }
              }
            }
          }
        });
      }

      buildChart();
    })();
  </script>
</body>

</html>
